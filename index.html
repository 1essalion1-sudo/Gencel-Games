
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gencel Gamer Free</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:white;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#10152f,#24205a,#111827);
}
header{text-align:center;padding:35px 15px 20px}
header h1{font-size:34px;margin:0}
header p{color:#c6c9e8}
.container{max-width:950px;margin:auto;padding:15px}
.panel{
 background:#ffffff12;border:1px solid #ffffff25;
 border-radius:20px;padding:20px;margin:15px 0;
 backdrop-filter:blur(12px)
}
.home{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:15px
}
.big{
 min-height:155px;display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 cursor:pointer;font-size:23px;font-weight:bold;
 transition:.2s
}
.big:hover,.game:hover{transform:translateY(-4px)}
button,.btn{
 border:0;border-radius:11px;padding:12px 16px;
 background:#765cff;color:white;font-size:14px;cursor:pointer
}
button:hover,.btn:hover{background:#927fff}
input{
 width:100%;padding:13px;margin:7px 0;
 border:1px solid #ffffff30;border-radius:10px;
 background:#111827;color:white
}
.game-list{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
 gap:12px
}
.game{
 background:#ffffff12;border:1px solid #ffffff25;
 border-radius:15px;padding:15px;transition:.2s
}
.game h3{margin:0 0 12px;font-size:17px}
.game-actions{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}
.small{font-size:12px;color:#c4c6dc}
.danger{background:#d94357}
#adminButton{
 position:fixed;right:15px;bottom:15px;
 border-radius:50px;background:#252b48;
 border:1px solid #ffffff40
}
footer{text-align:center;padding:25px;color:#aeb2d2}
hr{border:0;border-top:1px solid #ffffff25;margin:22px 0}
</style>
</head>
<body>

<header>
 <h1>Gencel Gamer Free</h1>
 <p>Your world of games</p>
 <div id="gameCount" class="small">Loading game count...</div>
</header>

<main class="container">

<section id="homePage">
 <div class="home">
  <div class="panel big" onclick="openAI()">
   🤖<br>Gencel AI
   <span class="small">Chat with AI</span>
  </div>
  <div class="panel big" onclick="showGames()">
   🕹️<br>Games
   <span class="small">Explore games</span>
  </div>
 </div>
</section>

<section id="gamesPage" class="hidden">
 <button onclick="goHome()">← Home</button>
 <div class="panel">
  <h2>🕹️ Games Library</h2>
  <div id="gameList" class="game-list"></div>
 </div>
</section>

<section id="adminPage" class="hidden">
 <button onclick="goHome()">← Home</button>

 <div class="panel">
  <h2>🔐 Admin Panel</h2>
  <h3>Add Game Using URL</h3>
  <input id="adminName" placeholder="Game name">
  <input id="adminURL" type="url" placeholder="https://example.com/game">
  <button onclick="addAdminURL()">Add Game URL</button>

  <hr>

  <h3>📁 Upload HTML Game</h3>
  <p class="small">Upload a single .html game file.</p>
  <input id="htmlFile" type="file" accept=".html,text/html">
  <button onclick="uploadGame()">Upload Game</button>

  <hr>

  <h3>Manage Added Games</h3>
  <div id="adminList"></div>
 </div>
</section>

</main>

<button id="adminButton" onclick="adminLogin()">Admin</button>
<footer>Gencel Gamer Free</footer>

<script>
const AI_URL="https://gencel-ai.vercel.app";
const ADMIN_PASSWORD="admin@password";

const defaultGames=[
 {name:"Floppy Car",url:"https://gencelgames.github.io/Floppy-car/"},
 {name:"Tic Tak",url:"https://gencelgames.github.io/Tic-Tak/"},
 {name:"Tab Tab",url:"https://gencelgames.github.io/Tab-Tab/"},
 {name:"Lucky Fifty",url:"https://gencelgames.github.io/Lucky-Fifty/"},
 {name:"Rock Paper Scissors",url:"https://gencelgames.github.io/Rock-Papaer-Scissors/"},
 {name:"Carrom",url:"https://gencelgames.github.io/Carrom/"},
 {name:"Firefly Jar",url:"https://gencelgames.github.io/Firefly-Jar/"},
 {name:"Easy Arrow Puzzle",url:"https://gencelgames.github.io/Arrows-Puzzle/"},
 {name:"Arrow Puzzle Advance",url:"https://gencelgames.github.io/Arrow-Puzzle-Advances/"},
 {name:"Number Merge",url:"https://gencelgames.github.io/Number-Merge/"},
 {name:"Snake",url:"https://gencelgames.github.io/Snake/"},
 {name:"Brick Bounce",url:"https://gencelgames.github.io/Brick-bounce/"},
 {name:"Echo Pads",url:"https://gencelgames.github.io/Echo-Pads/"},
 {name:"Lantern Drift",url:"https://gencelgames.github.io/Lantern-Drift/"},
 {name:"Tower Stack",url:"https://gencelgames.github.io/Tower-Stack/"},
 {name:"Connect Four",url:"https://gencelgames.github.io/Connect-Four/"},
 {name:"Sliding Puzzle",url:"https://gencelgames.github.io/Sliding-Puzzle/"},
 {name:"Space Dodge",url:"https://gencelgames.github.io/Space-Dodge/"},
 {name:"Reaction Test",url:"https://gencelgames.github.io/Reaction-Test/"},
 {name:"Color Match",url:"https://gencelgames.github.io/Color-Match/"},
 {name:"Hangman",url:"https://gencelgames.github.io/Hangman/"},
 {name:"Minesweeper",url:"https://gencelgames.github.io/Minesweeper/"},
 {name:"Memory Match",url:"https://gencelgames.github.io/Memory-Match/"},
 {name:"Whack-a-Mole",url:"https://gencelgames.github.io/Whack-a-Mole/"},
 {name:"Pong",url:"https://gencelgames.github.io/Pong/"},
 {name:"Luck Live",url:"https://gencelgames.github.io/Luck-Live/"},
 {name:"Neon Runner 3D",url:"https://gencelgames.github.io/Neon-Runner-3D/"},
 {name:"Gravity Flip 3D",url:"https://gencelgames.github.io/Gravity-Flip-3D/"}
];

let adminGames=JSON.parse(localStorage.getItem("adminGames")||"[]");
let db=null;

const $=id=>document.getElementById(id);

function openAI(){window.open(AI_URL,"_blank")}
function hidePages(){
 ["homePage","gamesPage","adminPage"].forEach(id=>$(id).classList.add("hidden"));
}
function goHome(){
 hidePages();
 $("homePage").classList.remove("hidden");
}
function showGames(){
 hidePages();
 $("gamesPage").classList.remove("hidden");
 renderGames();
}
function adminLogin(){
 const password=prompt("Enter Admin Password:");
 if(password===null)return;
 if(password!==ADMIN_PASSWORD){
  alert("Incorrect password!");
  return;
 }
 hidePages();
 $("adminPage").classList.remove("hidden");
 renderAdmin();
}
function validURL(value){
 try{
  const u=new URL(value);
  return u.protocol==="https:"||u.protocol==="http:";
 }catch{return false}
}

function addAdminURL(){
 const name=$("adminName").value.trim();
 const url=$("adminURL").value.trim();

 if(!name||!url){alert("Enter game name and URL.");return}
 if(!validURL(url)){alert("Enter a valid HTTP or HTTPS URL.");return}

 adminGames.push({name,url});
 localStorage.setItem("adminGames",JSON.stringify(adminGames));
 $("adminName").value="";
 $("adminURL").value="";
 renderAdmin();
 alert("Game added successfully! 🕹️");
}

function openDatabase(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open("ApexGamerDB",1);
  request.onupgradeneeded=()=>{
   const database=request.result;
   if(!database.objectStoreNames.contains("games")){
    database.createObjectStore("games",{keyPath:"id",autoIncrement:true});
   }
  };
  request.onsuccess=()=>{db=request.result;resolve(db)};
  request.onerror=()=>reject(request.error);
 });
}

async function uploadGame(){
 const file=$("htmlFile").files[0];
 if(!file){alert("Choose an HTML file first.");return}
 if(!file.name.toLowerCase().endsWith(".html")){
  alert("Only .html files are accepted.");return;
 }
 if(file.size>5*1024*1024){
  alert("Maximum file size is 5 MB.");return;
 }

 try{
  await openDatabase();
  const tx=db.transaction("games","readwrite");
  tx.objectStore("games").add({
   name:file.name.replace(/\.html$/i,""),
   file:file
  });
  tx.oncomplete=()=>{
   $("htmlFile").value="";
   renderAdmin();
   alert("HTML game uploaded! 🕹️");
  };
  tx.onerror=()=>alert("Upload failed.");
 }catch(e){alert("Could not save the game in this browser.")}
}

async function getUploadedGames(){
 await openDatabase();
 return new Promise((resolve,reject)=>{
  const req=db.transaction("games","readonly").objectStore("games").getAll();
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}

async function refreshGameCount(){
 const counter=$("gameCount");
 if(!counter)return;
 try{
  const uploaded=await getUploadedGames();
  counter.textContent="🎮 Total Games: "+(defaultGames.length+adminGames.length+uploaded.length);
 }catch(e){
  counter.textContent="🎮 Total Games: "+(defaultGames.length+adminGames.length);
 }
}

async function renderGames(){
 refreshGameCount();
 const list=$("gameList");
 list.innerHTML="";

 function addCard(name,icon,playAction){
  const card=document.createElement("div");
  card.className="game";
  const title=document.createElement("h3");
  title.textContent=icon+" "+name;
  const actions=document.createElement("div");
  actions.className="game-actions";
  const play=document.createElement("button");
  play.textContent="Play";
  play.onclick=playAction;
  actions.appendChild(play);
  card.append(title,actions);
  list.appendChild(card);
 }

 defaultGames.forEach(game=>{
  addCard(game.name,"🎮",()=>window.open(game.url,"_blank","noopener"));
 });

 adminGames.forEach(game=>{
  addCard(game.name,"🕹️",()=>window.open(game.url,"_blank","noopener"));
 });

 try{
  const uploaded=await getUploadedGames();
  uploaded.forEach(game=>{
   addCard(game.name,"🕹️",()=>playUploaded(game.id));
  });
 }catch(e){
  console.error(e);
 }
}

async function playUploaded(id){
 try{
  await openDatabase();
  const game=await new Promise((resolve,reject)=>{
   const req=db.transaction("games","readonly").objectStore("games").get(id);
   req.onsuccess=()=>resolve(req.result);
   req.onerror=()=>reject(req.error);
  });
  if(!game)return;

  const blobURL=URL.createObjectURL(game.file);
  const win=window.open("about:blank","_blank");
  if(!win){
   URL.revokeObjectURL(blobURL);
   alert("Allow pop-ups to play uploaded games.");
   return;
  }

  const frame=win.document.createElement("iframe");
  frame.src=blobURL;
  frame.sandbox="allow-scripts allow-forms";
  frame.style="position:fixed;inset:0;width:100%;height:100%;border:0";
  win.document.body.style.margin="0";
  win.document.body.appendChild(frame);
  win.addEventListener("pagehide",()=>URL.revokeObjectURL(blobURL),{once:true});
 }catch(e){alert("Could not open this game.")}
}

async function deleteUploaded(id){
 if(!confirm("Delete this uploaded game?"))return;
 await openDatabase();
 const tx=db.transaction("games","readwrite");
 tx.objectStore("games").delete(id);
 tx.oncomplete=renderAdmin;
}

function deleteURLGame(index){
 if(!confirm("Delete this game?"))return;
 adminGames.splice(index,1);
 localStorage.setItem("adminGames",JSON.stringify(adminGames));
 renderAdmin();
}

async function renderAdmin(){
 const list=$("adminList");
 list.innerHTML="";

 adminGames.forEach((game,index)=>{
  const item=document.createElement("div");
  item.className="game";
  item.style.margin="8px 0";
  const title=document.createElement("strong");
  title.textContent="🕹️ "+game.name;
  const del=document.createElement("button");
  del.className="danger";
  del.textContent="Delete";
  del.onclick=()=>deleteURLGame(index);
  item.append(title,del);
  list.appendChild(item);
 });

 try{
  const uploaded=await getUploadedGames();
  uploaded.forEach(game=>{
   const item=document.createElement("div");
   item.className="game";
   item.style.margin="8px 0";
   const title=document.createElement("strong");
   title.textContent="🕹️ "+game.name+" (HTML)";
   const del=document.createElement("button");
   del.className="danger";
   del.textContent="Delete";
   del.onclick=()=>deleteUploaded(game.id);
   item.append(title,del);
   list.appendChild(item);
  });
 }catch(e){console.error(e)}
}

goHome();
refreshGameCount();
</script>
</body>
</html>
